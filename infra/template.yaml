AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics sales day order system. Public ALB in front of a private,
  multi-AZ, CPU target-tracking Auto Scaling Group, with a Regional NAT Gateway
  for outbound updates. Deployed through CloudFormation Git sync.

Parameters:
  ProjectName:
    Type: String
    Default: onward-logistics
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Project part of the naming convention, lowercase.
  Environment:
    Type: String
    Default: lab
    AllowedValues:
      - lab
      - dev
      - test
      - prod
  Owner:
    Type: String
    Default: student
    Description: Owner tag value (Client Profile mandatory tag).
  CostCenter:
    Type: String
    Default: training
    Description: CostCenter tag value (Client Profile mandatory tag).
  StudentFullName:
    Type: String
    Description: Full name shown on every page served by the application.
  AppRepoUrl:
    Type: String
    Description: Public HTTPS Git URL of the repository that holds the app/ folder.
  AppRepoRef:
    Type: String
    Default: main
    Description: Branch or tag of the app repository to deploy (pin a tag such as v1.0.0).
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
  CpuCredits:
    Type: String
    Default: unlimited
    AllowedValues:
      - standard
      - unlimited
    Description: >-
      Burstable credit mode. unlimited keeps CPU at 100% during the load demo
      (a few cents of surplus credits); standard throttles to baseline when
      credits run out, which can stop the scale-out demo.
  MinSize:
    Type: Number
    Default: 2
    MinValue: 2
    Description: Minimum instances. At least 2 so that each AZ always has one.
  MaxSize:
    Type: Number
    Default: 6
    MinValue: 2
    Description: Maximum instances. Caps the worst-case cost of a peak day.
  TargetCpu:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 90
    Description: Average CPU percent that target tracking keeps the fleet at.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetACidr:
    Type: String
    Default: 10.0.0.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetACidr:
    Type: String
    Default: 10.0.10.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.11.0/24

Resources:
  # Network: VPC, 2 public and 2 private subnets across 2 AZs
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-vpc"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-igw"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public-a"
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public-b"
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-private-a"
        - Key: Tier
          Value: private
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-private-b"
        - Key: Tier
          Value: private
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public-rt"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - IgwAttach
    Properties:
      RouteTableId: !Ref PublicRt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  PublicSubnetAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRt

  PublicSubnetBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRt

  RegionalNat:
    Type: AWS::EC2::NatGateway
    DependsOn:
      - IgwAttach
    Properties:
      AvailabilityMode: regional # one NAT for all AZs, AWS allocates the EIPs
      ConnectivityType: public
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-regional-nat"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  PrivateRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-private-rt"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRt
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref RegionalNat

  PrivateSubnetAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRt

  PrivateSubnetBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRt

  # Security groups: Internet -> ALB SG -> App SG
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-alb-sg"
      GroupDescription: Public entry point, HTTP from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTP from the internet
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-alb-sg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-app-sg"
      GroupDescription: App servers, reachable only from the ALB security group
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: App port from the ALB only
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSg # only from the ALB, no CIDR, no port 22
      SecurityGroupEgress:
        - Description: HTTP out via NAT (package repos)
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: HTTPS out via NAT (git, pip, SSM, Secrets Manager)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-app-sg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  # Secret and IAM
  LoadTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-load-token"
      Description: Token that protects the /burn load-generation endpoint
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-load-token"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  ReadLoadTokenPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-read-load-token"
      Description: Lets app instances read the load-test token
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadLoadToken
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref LoadTokenSecret

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-app-role"
      Description: Role assumed by the app instances
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns: # managed policies only, no inline policies
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - !Ref ReadLoadTokenPolicy
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-app-role"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-${Environment}-app-profile"
      Roles:
        - !Ref InstanceRole

  # Load balancer: the only public entry point
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn:
      - PublicDefaultRoute
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSg
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-alb"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-tg"
      VpcId: !Ref Vpc
      Port: 8080
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        - Key: load_balancing.algorithm.type
          Value: round_robin
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-tg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # Compute: launch template, Auto Scaling Group, target tracking policy
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-${Environment}-lt"
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Name
              Value: !Sub "${ProjectName}-${Environment}-lt"
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Owner
              Value: !Ref Owner
            - Key: CostCenter
              Value: !Ref CostCenter
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        CreditSpecification:
          CpuCredits: !Ref CpuCredits
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref AppSg
        MetadataOptions:
          HttpTokens: required # IMDSv2 only
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        Monitoring:
          Enabled: true
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub "${ProjectName}-${Environment}-app-volume"
              - Key: Project
                Value: !Ref ProjectName
              - Key: Environment
                Value: !Ref Environment
              - Key: Owner
                Value: !Ref Owner
              - Key: CostCenter
                Value: !Ref CostCenter
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Installs the order app on every new instance.
            set -euxo pipefail
            exec > >(tee -a /var/log/onward-userdata.log) 2>&1

            dnf -y update
            dnf -y install git python3 python3-pip

            rm -rf /opt/app-src
            # Fresh copy of the app at the pinned Git ref.
            git clone --depth 1 --branch "${AppRepoRef}" "${AppRepoUrl}" /opt/app-src

            python3 -m venv /opt/app-venv
            /opt/app-venv/bin/pip install --upgrade pip
            /opt/app-venv/bin/pip install -r /opt/app-src/app/requirements.txt

            useradd --system --no-create-home --shell /sbin/nologin onward || true

            cat >/etc/onward.env <<'ENV'
            STUDENT_NAME="${StudentFullName}"
            LAB_NAME="Handling Sales Day Demand for the Onward Logistics Order System"
            TOKEN_SECRET_ID="${LoadTokenSecret}"
            AWS_REGION="${AWS::Region}"
            APP_VERSION="${AppRepoRef}"
            ENV

            cat >/etc/systemd/system/onward.service <<'UNIT'
            [Unit]
            Description=Onward Logistics order app
            Wants=network-online.target
            After=network-online.target

            [Service]
            User=onward
            EnvironmentFile=/etc/onward.env
            WorkingDirectory=/opt/app-src/app
            ExecStart=/opt/app-venv/bin/gunicorn --bind 0.0.0.0:8080 --workers 1 --threads 8 --timeout 30 app:app
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            UNIT

            systemctl daemon-reload
            systemctl enable --now onward

            # Fail the boot if the app is not healthy within 60 seconds.
            for i in $(seq 1 30); do
              curl -fs http://127.0.0.1:8080/health && exit 0
              sleep 2
            done
            echo "onward app did not become healthy" >&2
            exit 1

  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - PrivateDefaultRoute
      - PrivateSubnetAAssoc
      - PrivateSubnetBAssoc
    Properties:
      AutoScalingGroupName: !Sub "${ProjectName}-${Environment}-asg"
      MinSize: !Ref MinSize # DesiredCapacity left out so updates do not reset scaling
      MaxSize: !Ref MaxSize
      VPCZoneIdentifier:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 240 # time for UserData before health checks count
      DefaultInstanceWarmup: 180
      CapacityRebalance: true
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-app"
          PropagateAtLaunch: true
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true
        - Key: Owner
          Value: !Ref Owner
          PropagateAtLaunch: true
        - Key: CostCenter
          Value: !Ref CostCenter
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT4M
        SuspendProcesses:
          - AlarmNotification
          - ScheduledActions

  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Asg
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 180
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization # keep average CPU at TargetCpu
        TargetValue: !Ref TargetCpu
        DisableScaleIn: false

Outputs:
  AlbDnsName:
    Description: Single public entry point (open in a browser)
    Value: !Sub "http://${Alb.DNSName}"
  AsgName:
    Description: Auto Scaling Group name
    Value: !Ref Asg
  TargetGroupArn:
    Description: Target group ARN (use for describe-target-health)
    Value: !Ref TargetGroup
  TokenSecretArn:
    Description: Secret holding the load-test token (read it with the AWS CLI, never commit it)
    Value: !Ref LoadTokenSecret
  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
  NatGatewayId:
    Description: Regional NAT Gateway ID
    Value: !Ref RegionalNat
  PrivateRouteTableId:
    Description: Private route table (0.0.0.0/0 to the Regional NAT)
    Value: !Ref PrivateRt
